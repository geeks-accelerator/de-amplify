# CI: run the guards that were previously honor-system.
#
# WHY THIS EXISTS. This repo's whole discipline is catching drift that looks
# exactly like correctness, and until now every one of its guards was a command
# a human had to remember. CONTRIBUTING.md asks for five of them; nothing ran
# any of them. Every incident in the project's history was silent and green:
# the content dates that froze for three weeks, the K.G.M. opener that stayed in
# the future tense for eight days, the two indexable URLs with one meta
# description. A wrong date is not a compile error, which is exactly why it needs
# a job that fails.
#
# fetch-depth: 0 is load-bearing. check:dates resolves git author dates and
# compares them to the committed manifest; a shallow clone has no history, so it
# would report drift on every path and the check would be worse than useless.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, Mondays, matching dependabot.yml. Without it the audit job only ran
  # when someone pushed, so main's last run (2026-08-29) stayed green through a
  # month of critical Next.js advisories that nothing ever re-checked. Only the
  # `staleness` job runs on the schedule: it is the only one whose answer can
  # change without a commit.
  schedule:
    - cron: "0 14 * * 1"

# The event is part of the group so the weekly run on main and a push to main
# never share one. With a shared group, cancel-in-progress let whichever started
# second cancel the other, and a cancelled push run shows no result for its
# commit.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ONE NODE VERSION, READ FROM ONE PLACE. Every job takes its Node version from
  # `engines.node` in package.json, which is also what Railpack reads for the
  # production build. CI used to hardcode 20 here (copying a nixpacks.toml pin)
  # and 22 in the guard job (for a type-stripping flag), so the versions could
  # and did disagree. Now they cannot: changing the runtime is one edit, and CI
  # verifies the same runtime production runs.
  #
  # npm ci here is what makes the lockfile the production pin. It fails if
  # package.json and package-lock.json disagree, so on any green commit the two
  # are in sync, and Railpack's `npm install` then resolves exactly the lockfile
  # tree. A green build here is a build of the tree that ships.
  build:
    name: lint and build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: build (typecheck + compile)
        run: npm run build

      # .railway/railway.ts is not part of the app and Railway does not read it
      # at deploy time, so it is typechecked here rather than inside the
      # production build, where an SDK type change could block a content deploy.
      - name: check:iac (.railway/railway.ts typechecks against the railway SDK)
        run: npm run check:iac

  # `check:ledgers` imports the real src/lib/distillations.ts rather than
  # reimplementing the TLDR parser, which is deliberate: a checker with its own
  # parser can disagree with the build and silently pass. Node 26 strips types
  # natively, so it runs as plain `node` with no flags.
  #
  # fetch-depth: 0 is load-bearing HERE and not in the build job: check:dates
  # compares the committed manifest against real git author dates, and a shallow
  # clone would report drift on every path.
  guards:
    name: the drift guards
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: check:dates (committed manifest matches git history)
        run: npm run check:dates

      - name: check:ledgers (verbatim TLDR consumers, raw-route coverage)
        run: npm run check:ledgers

      - name: check:quotes (quoted spans verbatim against the source caches)
        run: npm run check:quotes
      - name: check:surfaces (share cards and structured data vs the record)
        run: npm run check:surfaces

      - name: check:distillations (single-source files, internal consistency)
        run: npm run check:distillations

      - name: check:issues (standing threads, schema and index)
        run: npm run check:issues

      # Cheap, and it closes the most-repeated documentation defect in this repo:
      # a guard that runs here while the lists a human reads do not mention it.
      - name: check:guards (every guard is listed on every surface that lists guards)
        run: npm run check:guards

      # The house-style sweep from CLAUDE.md. One exact codepoint per pattern
      # under the C locale: the naive bracket-class grep over-reports badly on
      # BSD/macOS and sends you chasing ghosts. sources/ and reviews/ are exempt
      # because their punctuation is evidence, not prose. CLAUDE.md is excluded
      # because it documents the rule by quoting the characters, so it always
      # self-matches.
      - name: house style (no em/en dashes, no curly quotes)
        run: |
          if LC_ALL=C grep -rn \
            --exclude-dir=sources --exclude-dir=reviews --exclude=CLAUDE.md \
            -e $'—' -e $'–' -e $'‘' -e $'’' -e $'“' -e $'”' \
            src/ content/ docs/ *.md; then
            echo "::error::House style violation. Use commas, colons, parentheses, or restructure."
            echo "Straight quotes only; no em-dash or en-dash as punctuation. See CLAUDE.md."
            exit 1
          fi
          echo "house style OK."

  staleness:
    # Deliberately a SEPARATE job, and the only one that runs on the weekly
    # schedule: both checks here can go red with no commit at all, because the
    # world moved. A dependency advisory or a Node security release is worth
    # seeing on every PR, but it is not the PR author's fault and should not be
    # the thing that blocks an unrelated content fix. No status checks are
    # required on main, so this reports without gating.
    #
    # npm audit exists because the sharp/libvips advisories sat in the
    # production tree unnoticed; the lockfile it audits is the tree production
    # installs. check:node exists because engines pins Node exactly (Railpack
    # drops a range's floor), so no release ever arrives on its own and nothing
    # else would say one was missed. That is how production ran end-of-life
    # Node 20 for six months.
    name: staleness (dependency audit, node security releases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
      - name: check:node (engines is not behind a security release on its line)
        if: ${{ !cancelled() }}
        run: npm run check:node
